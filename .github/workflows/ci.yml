name: CI

# Gates every PR and every push to main. Deployment itself is Vercel's Git
# integration; this workflow decides whether the code deserves to get there.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A new push supersedes an in-flight run on the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Node 24 matches local development.
  NODE_VERSION: "24"

jobs:
  verify:
    name: Typecheck, migrate, build and e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast: the cheapest checks run before the build.
      - name: Catalogue integrity
        run: node scripts/check-catalog.mjs

      - name: Typecheck
        run: npx tsc --noEmit

      # The seed JSON is generated from the vendored scrape, and the seed
      # migration is generated from the JSON. Both are committed; if either
      # regenerates differently, they have drifted.
      - name: Seed data is reproducible
        run: |
          node scripts/build-catalog.mjs scripts/raw > /dev/null
          git diff --exit-code supabase/seed/products.json \
            || { echo "::error::supabase/seed/products.json differs from a fresh build of scripts/raw"; exit 1; }
          node scripts/catalog-to-sql.mjs | diff -q - supabase/migrations/0003_catalog_seed.sql \
            || { echo "::error::0003_catalog_seed.sql differs from scripts/catalog-to-sql.mjs output"; exit 1; }
          echo "seed reproduces exactly"

      # The storefront reads everything from Postgres; nothing may sneak back
      # in as a bundled fixture.
      - name: No runtime mock data
        run: |
          if grep -rnE "products\.json|generatedReviews" src; then
            echo "::error::src must not import catalogue fixtures"; exit 1
          fi

      # A throwaway Supabase stack: every migration is applied from scratch,
      # and the e2e suites write their test users here, never to production.
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase (applies all migrations)
        run: |
          supabase start -x studio,logflare,vector,realtime,storage-api,imgproxy,edge-runtime,supavisor,postgres-meta,mailpit
          supabase status -o env \
            | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"

      - name: Production build
        run: npm run build

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx --yes playwright@1.63.0 install-deps chromium

      - name: Start the app
        run: |
          npx next start --port 3100 &
          npx wait-on -t 60000 http://localhost:3100/api/v1/health

      - name: API e2e — catalogue, cart, checkout, reviews over REST
        run: node scripts/api-e2e.mjs
        env:
          BASE_URL: http://localhost:3100

      - name: E2E — guest shopping flow
        run: node scripts/e2e.mjs
        env:
          BASE_URL: http://localhost:3100

      - name: E2E — register, checkout, order history, review
        run: node scripts/e2e-checkout.mjs
        env:
          BASE_URL: http://localhost:3100

      - name: Mobile layout — no horizontal overflow at 390px, no broken images
        run: node scripts/layout-check.mjs / /s "/s?q=lego&c=toys" /deals /product/B0DBF65JYY /cart /signin /register /api
        env:
          BASE_URL: http://localhost:3100

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: .shots/
          if-no-files-found: ignore
          retention-days: 7
