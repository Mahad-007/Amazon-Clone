name: Post-deploy smoke

# Runs against the real production URL once Vercel reports a successful
# deployment, so a green CI that still ships a broken site gets caught.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL to smoke test
        required: false
        default: https://shop-amazon-clone.vercel.app

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # deployment_status fires for every state; only act on a live production one.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx --yes playwright@1.63.0 install --with-deps chromium

      - name: Install Chromium system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx --yes playwright@1.63.0 install-deps chromium

      - name: Resolve target URLs
        id: target
        run: |
          # Two different things are worth checking, and they are not the
          # same URL. PUBLIC is the stable alias real visitors are given —
          # that is what must never stop loading. DEPLOY is the immutable
          # per-deployment URL, which is exactly the build that just shipped.
          PUBLIC="https://shop-amazon-clone.vercel.app"
          DEPLOY="${{ github.event.inputs.url || github.event.deployment_status.environment_url }}"
          DEPLOY="${DEPLOY:-$PUBLIC}"
          echo "public=$PUBLIC" >> "$GITHUB_OUTPUT"
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "public: $PUBLIC"
          echo "deploy: $DEPLOY"

      # The live link must load for a signed-out visitor. This is the single
      # requirement most likely to regress silently — Vercel turns deployment
      # protection on for new projects, which 302s every anonymous visitor.
      - name: Public URL loads anonymously
        run: |
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "${{ steps.target.outputs.public }}")
          echo "anonymous GET / -> $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::The public URL is not reachable without signing in (HTTP $CODE)"
            exit 1
          fi

      - name: Key routes respond
        run: |
          FAILED=0
          for path in / /s /deals /cart /signin /product/B0DBF65JYY; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "${{ steps.target.outputs.deploy }}$path")
            printf '%s  %s\n' "$CODE" "$path"
            [ "$CODE" = "200" ] || FAILED=1
          done
          [ "$FAILED" = "0" ] || { echo "::error::A key route did not return 200"; exit 1; }

      - name: E2E — guest shopping flow against the new deployment
        run: node scripts/e2e.mjs
        env:
          BASE_URL: ${{ steps.target.outputs.deploy }}
